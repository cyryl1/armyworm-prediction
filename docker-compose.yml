
services:
  db:
    image: postgres:15-alpine
    container_name: armyworm_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: armyworm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5



  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: armyworm_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      # Mount local code so changes are reflected instantly
      - ./backend/app:/app/app
    environment:
      # Connects to the 'db' service defined above
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/armyworm_db
    # Enable hot-reload: uvicorn watches for file changes
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: armyworm_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
